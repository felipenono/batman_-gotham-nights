<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Batman: Noites dos Vilões</title>
    <meta
      name="description"
      content="Jogo de ação e plataformas: enfrente Coringa, Espantalho, Pinguim, Arlequina e Duas-Caras em Gotham."
    />
    <meta property="og:title" content="Batman: Noites dos Vilões" />
    <meta
      property="og:description"
      content="Jogo de ação e plataformas: enfrente Coringa, Espantalho, Pinguim, Arlequina e Duas-Caras em Gotham."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/styles/game.css">
      <link rel="stylesheet" href="/src/styles/lobby.css">
    <link rel="stylesheet" href="/src/styles/end-game.css">
  </head>
  <body>
    <div class="game-wrapper">
      <div class="arcade-cabinet">
        <canvas id="game-canvas" width="1920" height="1080"></canvas>
        <section id="screen-ui" aria-label="Telas do jogo"></section>
        <div id="scene-transition" aria-hidden="true"></div>
      </div>

      <div class="footer-controls">
        <div class="status-pill">
          <span class="key-badge">A</span> <span class="key-badge">D</span> / <span class="key-badge">←</span> <span class="key-badge">→</span> Mover
        </div>
        <div class="status-pill">
          <span class="key-badge">W</span> / <span class="key-badge">ESPAÇO</span> Pular
        </div>
        <div class="status-pill">
          <span class="key-badge">CLIQUE</span> / <span class="key-badge">X</span> Batarangue (um por clique; recarga de 0,5 s; até 5 ativos)
        </div>
        <div class="status-pill">
          <span class="key-badge">M</span> Ligar/desligar som
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
