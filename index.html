<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Batman: Gotham Nights</title>
    <meta
      name="description"
      content="Jogo de ação e plataformas: enfrente Coringa, Espantalho, Pinguim, Arlequina e Duas-Caras em Gotham."
    />
    <meta property="og:title" content="Batman: Gotham Nights" />
    <meta
      property="og:description"
      content="Jogo de ação e plataformas: enfrente Coringa, Espantalho, Pinguim, Arlequina e Duas-Caras em Gotham."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/views/styles/game.css">
      <link rel="stylesheet" href="/src/views/styles/lobby.css">
    <link rel="stylesheet" href="/src/views/styles/end-game.css">
  </head>
  <body>
    <div class="game-wrapper">
      <div class="arcade-cabinet">
        <canvas id="game-canvas" width="1920" height="1080"></canvas>
        <section id="screen-ui" aria-label="Telas do jogo"></section>
        <nav id="touch-controls" data-mobile-controls aria-label="Controles de toque" hidden>
          <div class="touch-joystick" data-touch-joystick role="group" aria-label="Joystick: arraste para os lados para andar e para cima para pular">
            <span class="touch-joystick-track" aria-hidden="true"></span>
            <span class="touch-joystick-thumb" aria-hidden="true"></span>
          </div>
          <button type="button" class="touch-button touch-pause" data-touch-pause aria-label="Pausar jogo">II</button>
          <div class="touch-group">
            <button type="button" class="touch-button touch-fire" data-touch-action="SHOOT">ATIRAR</button>
            <button type="button" class="touch-button touch-jump" data-touch-action="JUMP">PULAR</button>
          </div>
        </nav>
        <button type="button" id="fullscreen-button" class="touch-button touch-fullscreen" data-mobile-controls aria-label="Entrar em tela cheia" aria-pressed="false" title="Tela cheia" hidden>&#x26F6;</button>
        <p id="fullscreen-status" class="fullscreen-status" role="status" hidden></p>
        <div id="scene-transition" aria-hidden="true"></div>
      </div>

      <div class="footer-controls">
        <div class="status-pill">
          <span class="key-badge">A</span> <span class="key-badge">D</span> / <span class="key-badge">←</span> <span class="key-badge">→</span> Mover
        </div>
        <div class="status-pill">
          <span class="key-badge">W</span> / <span class="key-badge">ESPAÇO</span> Pular
        </div>
        <div class="status-pill">
          <span class="key-badge">CLIQUE</span> / <span class="key-badge">X</span> Batarangue (um por clique; recarga de 0,5 s; até 5 ativos)
        </div>
        <div class="status-pill">
          <span class="key-badge">M</span> Ligar/desligar som
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
