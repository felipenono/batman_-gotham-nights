<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão de telas e sprites</title><style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: #050811;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        background-image:
          radial-gradient(circle at 50% 20%, rgba(30, 27, 75, 0.6) 0%, transparent 70%),
          radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.8) 0%, #030712 100%);
      }

      .game-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: min(1964px, calc((100vh - 100px) * 1.77778));
        padding: 8px 12px;
      }

      .arcade-cabinet {
        width: 100%;
        position: relative;
        background: #0f172a;
        padding: 10px;
        border-radius: 12px;
        box-shadow:
          0 0 0 2px #334155,
          0 0 20px rgba(0, 0, 0, 0.8),
          0 0 35px rgba(234, 179, 8, 0.15);
      }

      #game-canvas {
        display: block;
        width: 100%;
        max-width: 1920px;
        height: auto;
        aspect-ratio: 16 / 9;
        background-color: #000000;
        border-radius: 6px;
        cursor: crosshair;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
      }

      .footer-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 10px;
        font-size: 13px;
        color: #94a3b8;
      }

      .key-badge {
        display: inline-block;
        background: #1e293b;
        color: #facc15;
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 2px 6px;
        font-family: monospace;
        font-weight: bold;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }

      .status-pill {
        color: #cbd5e1;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      @media (max-width: 640px) {
        .footer-controls {
          font-size: 11px;
          gap: 8px;
        }
      }

      #screen-ui {container-type:size;position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}
      #screen-ui[hidden] {display:none}
      .screen-panel {width:95%;padding-top:11.1cqw;display:flex;align-items:center;flex-direction:column;gap:2cqw}
      .screen-panel.menu-panel {padding-top:22.8cqw;gap:1.1cqw}
      .screen-panel h1 {font-size:clamp(18px,4.2cqw,81px);color:#f4d37a;line-height:1.1}
      .eyebrow {font-size:1.22cqw;letter-spacing:.33cqw;color:#c4a766;font-weight:700}
      .screen-panel p:not(.eyebrow),.screen-panel small {font-size:1.44cqw;color:#b7c4d7}
      .screen-actions {display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
      .screen-panel button {pointer-events:auto;cursor:pointer;padding:1.33cqw 2.67cqw;border:1px solid #ddbd63;border-radius:6px;background:#f4cf66;color:#151a25;font:700 1.67cqw system-ui}
      .screen-panel button[data-action="menu"] {background:#172231;color:#e5e7eb;border-color:#506077}
      .screen-panel button:focus-visible {outline:3px solid white;outline-offset:4px}
      .screen-panel button:disabled {opacity:.4;cursor:wait}

    
body{overflow:auto;justify-content:flex-start;padding:20px}nav button{padding:10px;margin:4px}.arcade-cabinet{max-width:920px}.gallery{display:grid;grid-template-columns:repeat(6,160px);gap:8px}.gallery figure{background:#182234;padding:8px;text-align:center}.gallery canvas{width:144px;height:144px}.gallery figcaption{font:12px monospace}pre{white-space:pre-wrap}
</style><nav><button id="menu">Início</button><button id="over">Fim de jogo</button><button id="victory">Vitória</button><button id="death">Testar morte real</button><button id="sprites">Verificar sprites</button></nav>
<div class="arcade-cabinet"><canvas id="game-canvas" width="1920" height="1080"></canvas><section id="screen-ui"></section></div><pre id="results">Selecione uma tela.</pre><div class="gallery"></div>
<script type="module">
import {loadSprites} from '../src/utils/SpriteAnimator.js';
await loadSprites();
import {Game} from '../src/core/Game.js';
import {SPRITE_ART,SPRITE_ACTIONS,spriteFrame} from '../src/utils/SpriteAnimator.js';
const game=new Game(document.querySelector('#game-canvas')),results=document.querySelector('#results');
let running=false;
function show(state){running=false;game.restartGame();game.state=state;game.gameOverCooldown=0;game._render();game.screenUI.update();results.textContent='Tela: '+state;}
document.querySelector('#menu').onclick=()=>show('MENU');
document.querySelector('#over').onclick=()=>show('GAME_OVER');
document.querySelector('#victory').onclick=()=>show('VICTORY');
document.querySelector('#death').onclick=()=>{game.restartGame();game.spawner.timer=99999;game.player.lives=1;game.player.invulnerable=0;game.player.takeDamage(3);running=true;};
document.querySelector('#screen-ui').addEventListener('click',()=>{game._render();results.textContent='Estado após botão: '+game.state;});
function frame(){if(running){game._update(1);game._render();game.screenUI.update();if(game.state==='GAME_OVER'&&game.gameOverCooldown<=0)running=false;}requestAnimationFrame(frame);}frame();
document.querySelector('#sprites').onclick=()=>{
 const gallery=document.querySelector('.gallery');gallery.replaceChildren();let count=0,clipped=[];
 for(const key of Object.keys(SPRITE_ART))for(const [action,n] of Object.entries(SPRITE_ACTIONS)){
  for(let i=0;i<n;i++){
   const c=spriteFrame(key,action,i),d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
   for(let p=0;p<c.width;p++)if(d[p*4+3]||d[((c.height-1)*c.width+p)*4+3]||d[p*c.width*4+3]||d[(p*c.width+c.width-1)*4+3]){clipped.push(key+'_'+action+'_'+i);break;}
   count++;
  }
  const figure=document.createElement('figure'),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(spriteFrame(key,action,action==='death'?9:2),0,0,256,256);
  const label=document.createElement('figcaption');label.textContent=key+'_'+action;figure.append(c,label);gallery.append(figure);
 }
 results.textContent=count+' quadros renderizados. Bordas cortadas: '+clipped.length+(clipped.length?' '+clipped.join(', '):'. Todos transparentes nas extremidades.');
};show('MENU');
</script></html>
